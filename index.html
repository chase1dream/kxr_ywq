<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康晓睿&杨雯琪</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <div class="home-container">
        <div class="home-content">
            <h1 class="home-title">我们的回忆</h1>
            <!-- <p class="home-subtitle">选择您想浏览的相册</p> -->
            
            <div class="album-cards">
                <!-- 婚纱照 -->
                <div class="album-card" onclick="openViewer('images', '婚纱照')">
                    <div class="album-card-bg" style="background-image: url('./images/1.png')">
                        <div class="album-card-overlay"></div>
                    </div>
                    <div class="album-card-content">
                        <h2 class="album-title">婚纱照</h2>
                        <h3 class="album-title2">（2026.5.14）</h3>
                        <p class="album-desc">Wedding Photos</p>
                        <button class="album-btn">查看相册</button>
                    </div>
                </div>

                <!-- 订婚照 -->
                <div class="album-card" onclick="openViewer('images1', '订婚照')">
                    <div class="album-card-bg" style="background-image: url('./images1/37.png')">
                        <div class="album-card-overlay"></div>
                    </div>
                    <div class="album-card-content">
                        <h2 class="album-title">订婚照</h2>
                        <h3 class="album-title2">（丙午年正月初八&2026.2.24）</h3>
                        <p class="album-desc">Engagement Photos</p>
                        <button class="album-btn">查看相册</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openViewer(folder, title) {
            // 跳转到浏览器页面，通过URL参数传递文件夹和标题
            window.location.href = `viewer.html?folder=${folder}&title=${encodeURIComponent(title)}`;
        }
    </script>
</body>
</html>
