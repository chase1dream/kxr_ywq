<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title id="pageTitle">康晓睿&杨雯琪</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 加载进度条 -->
    <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0%</div>
    </div>

    <!-- 音乐控制 -->
    <div class="music-controls" id="musicControls">
        <button class="music-btn" id="musicToggleBtn" title="播放/暂停音乐">
            <span class="music-icon">🎵</span>
        </button>
        <button class="music-btn" id="musicSelectBtn" title="选择音乐">
            <span>🎶</span>
        </button>
        <div class="music-volume">
            <input type="range" id="volumeSlider" min="0" max="100" value="30" title="音量">
        </div>
    </div>

    <!-- 音乐选择弹窗 -->
    <div class="music-modal" id="musicModal">
        <div class="music-modal-content">
            <div class="music-modal-header">
                <h3>选择背景音乐</h3>
                <button class="music-modal-close" id="musicModalClose">✕</button>
            </div>
            <div class="music-list" id="musicList">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- 返回按钮 -->
    <button class="back-btn" id="backBtn" aria-label="返回">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>返回</span>
    </button>

    <div class="viewer" id="viewer">
        <!-- 标题 -->
        <div class="viewer-title" id="viewerTitle">婚纱照</div>

        <!-- 幻灯片容器 -->
        <div class="slides-container" id="slidesContainer"></div>

        <!-- 导航按钮 -->
        <button class="nav-btn prev-btn" id="prevBtn" aria-label="上一张">‹</button>
        <button class="nav-btn next-btn" id="nextBtn" aria-label="下一张">›</button>

        <!-- 顶部信息栏 -->
        <div class="top-bar">
            <span class="image-name" id="imageName"></span>
            <span class="counter" id="counter">0 / 0</span>
        </div>

        <!-- 滑动指示器（底部圆点） -->
        <div class="slide-indicators" id="slideIndicators"></div>

        <!-- 缩略图栏 -->
        <div class="thumbnail-bar" id="thumbnailBar">
            <div class="thumbnail-header">
                <span class="thumbnail-title" id="thumbnailTitle">所有图片</span>
                <button class="thumbnail-close" id="thumbnailClose">✕</button>
            </div>
            <div class="thumbnail-container" id="thumbnailContainer"></div>
        </div>

        <!-- 底部控制 -->
        <div class="bottom-controls" id="bottomControls">
            <button class="control-btn" id="toggleThumbnails">
                <span>🖼</span> 缩略图
            </button>
            <button class="control-btn" id="autoPlayBtn">
                <span>▶</span> 自动播放
            </button>
        </div>

        <!-- 滑动提示 -->
        <div class="hint-text" id="hintText">← 左右滑动切换图片 →</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
